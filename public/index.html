<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <title>DashKill</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <main id="gameShell">

        <canvas id="game"></canvas>

        <div id="hud">
            <div class="hud-left">
                <div class="logo">DASHKILL</div>

                <div class="status">
                    <div class="status-item">
                        <span class="label">DASH</span>
                        <span id="dashStatus" class="value ready">READY</span>
                    </div>

                    <div class="status-item">
                        <span class="label">SHOTS</span>
                        <span id="shotStatus" class="value">2 / 2</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="crosshair"></div>

        <!-- CONTROLES MÓVILES -->
        <div id="mobileControls">

            <div
                id="moveJoystick"
                class="joystick-zone left-zone"
            >
                <div class="joystick">
                    <div class="joystick-knob"></div>
                </div>
            </div>

            <div
                id="aimJoystick"
                class="joystick-zone right-zone"
            >
                <div class="joystick">
                    <div class="joystick-knob"></div>
                </div>
            </div>

            <button id="fireButton" class="mobile-button fire-button">
                FIRE
            </button>

            <button id="dashButton" class="mobile-button dash-button">
                DASH
            </button>

        </div>

    </main>

    <script src="/game.js"></script>
</body>
</html>
