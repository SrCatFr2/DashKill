<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover"
    >

    <title>DashKill</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="hud">

        <div id="brand">
            DASHKILL
        </div>

        <div id="stats">

            <div class="stat">
                <span>DASH</span>
                <strong id="dashValue">READY</strong>
            </div>

            <div class="stat">
                <span>SHOTS</span>
                <strong id="shotsValue">2 / 2</strong>
            </div>

        </div>

    </div>

    <div id="crosshair"></div>

    <div id="mobileControls">

        <div
            id="movePad"
            class="joystickPad"
        >
            <div class="joystickBase">
                <div class="joystickKnob"></div>
            </div>
        </div>

        <div
            id="aimPad"
            class="joystickPad"
        >
            <div class="joystickBase">
                <div class="joystickKnob"></div>
            </div>
        </div>

        <button
            id="fireButton"
            class="actionButton fire"
        >
            FIRE
        </button>

        <button
            id="dashButton"
            class="actionButton dash"
        >
            DASH
        </button>

    </div>

    <div id="portraitWarning">
        <div>
            <b>DASHKILL</b>
            <span>GIRA TU DISPOSITIVO</span>
            <small>El juego requiere orientación horizontal.</small>
        </div>
    </div>

</div>

<script type="module" src="/js/main.js"></script>

</body>
</html>
