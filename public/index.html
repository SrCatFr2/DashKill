<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover"
    >

    <meta name="theme-color" content="#050606">

    <title>DashKill</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div id="game">

    <canvas id="canvas"></canvas>


    <!-- ==============================
         HUD
    =============================== -->

    <div id="hud">

        <div id="brand">
            DASHKILL
        </div>

        <div id="stats">

            <div class="stat">
                <span>DASH</span>
                <strong id="dashValue">READY</strong>
            </div>

            <div class="stat">
                <span>SHOTS</span>
                <strong id="shotsValue">2 / 2</strong>
            </div>

        </div>

    </div>


    <!-- ==============================
         CROSSHAIR
    =============================== -->

    <div id="crosshair"></div>


    <!-- ==============================
         MOBILE CONTROLS
    =============================== -->

    <div id="mobileControls">

        <!-- MOVIMIENTO -->

        <div
            id="movePad"
            class="joystickPad"
        >
            <div class="joystickBase">
                <div class="joystickKnob"></div>
            </div>
        </div>


        <!-- AIM -->

        <div
            id="aimPad"
            class="joystickPad"
        >
            <div class="joystickBase">
                <div class="joystickKnob"></div>
            </div>
        </div>


        <!-- FIRE -->

        <button
            id="fireButton"
            class="actionButton fire"
            type="button"
        >
            FIRE
        </button>


        <!-- DASH -->

        <button
            id="dashButton"
            class="actionButton dash"
            type="button"
        >
            DASH
        </button>

    </div>


    <!-- ==============================
         PORTRAIT WARNING
    =============================== -->

    <div id="portraitWarning">

        <div class="portraitBox">

            <b>DASHKILL</b>

            <span>
                GIRA TU DISPOSITIVO
            </span>

            <small>
                El juego requiere orientación horizontal.
            </small>

        </div>

    </div>

</div>


<!-- ==============================
     GAME
=============================== -->

<script
    type="module"
    src="/js/main.js"
></script>

</body>
</html>
